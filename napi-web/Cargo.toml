[package]
name = "wgpu-napi-web"
version.workspace = true
edition.workspace = true
description = "Node-API (napi-rs) backed JavaScript interop for wgpu's WebGPU backend on wasm32-wasip1"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]

[dependencies]
wgpu-napi-web-macro = { workspace = true }
log.workspace = true

# Only the raw Node-API ABI is needed, and it is the one part of napi-rs that is
# free of build-script requirements: `napi-build`'s WASI setup insists on
# `EMNAPI_LINK_DIR`, which belongs to the final addon that links emnapi, not to a
# library in the middle. `napi5` is the floor for `napi_add_finalizer`, which is
# how a Rust closure handed to JavaScript is freed.
#
# On wasm, napi-sys declares the `napi_*` symbols as plain wasm imports, which is
# what emnapi resolves. Everywhere else `dyn-symbols` is added so this crate still
# *links* — its stubs resolve to "symbol not loaded" instead of an unresolved
# reference — which is what keeps a host-side `cargo test --workspace` working
# even though nothing but WASI ever calls into it.
[target.'cfg(target_family = "wasm")'.dependencies]
napi-sys = { workspace = true, features = ["napi5"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
napi-sys = { workspace = true, features = ["napi5", "dyn-symbols"] }

[lints]
workspace = true
