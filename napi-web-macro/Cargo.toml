[package]
name = "wgpu-napi-web-macro"
version.workspace = true
edition.workspace = true
description = "The `#[wasm_bindgen]` attribute subset used by wgpu's vendored WebGPU bindings, lowered onto Node-API"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
# Minimums, not floors of convenience: CI resolves with
# `-Zdirect-minimal-versions`, so each of these is the oldest release that
# actually builds this macro.
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.118", features = ["full", "extra-traits"] }

[lints]
workspace = true
